name: Classroom infrastructure static checks
on:
  push:
    paths: ['server/**', '.github/workflows/classroom-static.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/classroom-static.yml']
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and storage guard regression checks
        run: |
          for f in server/scripts/*.sh; do bash -n "$f"; done
          python -m compileall -q server/scripts server/tests
          python server/tests/test_storage_guards.py -v
          ruby -c server/Vagrantfile
          ruby server/tests/test_vagrant_config.rb
