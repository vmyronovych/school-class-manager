name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: dotnet build
        run: dotnet build

      - name: dotnet test
        run: dotnet test --no-build

      - name: web install
        working-directory: web
        run: npm ci

      - name: web test
        working-directory: web
        run: npm test -- --run

      - name: web build
        working-directory: web
        run: npm run build

      - name: publish linux-arm64
        run: dotnet publish src/Scm.Api -c Release -r linux-arm64 --self-contained -o out/

      - uses: actions/upload-artifact@v4
        with:
          name: scm-linux-arm64
          path: out/
